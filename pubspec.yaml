name: kavo_app
description: "Kavo: one shopping app, three storefronts (fashion, grocery and furniture) with a shared cart."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  go_router: ^18.1.1
  google_fonts: ^9.0.0
  material_ui: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/fa/
    - assets/images/gr/
    - assets/images/fu/
    # Jost is bundled so google_fonts never needs the network (and tests stay offline).
    - assets/fonts/
